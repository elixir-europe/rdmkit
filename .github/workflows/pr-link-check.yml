name: Link Checker (PR)

# Checks only the links that a pull request adds or changes, so a broken link
# is flagged in review instead of in the nightly Link Checker Report.
on:
  pull_request:
    branches: [master, main]
    paths:
      - '**.md'
      - '**.yml'
      - '**.yaml'
      - '!.github/**'

permissions:
  contents: read

jobs:
  linkChecker:
    if: |
      github.repository_owner == 'elixir-europe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect lines added by this PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Keep only the added/changed lines of content files; lychee then
          # extracts the links from them. Written outside the workspace because
          # lychee-action removes ./lychee before it runs.
          git diff --unified=0 --no-color --diff-filter=AMR "$BASE_SHA...$HEAD_SHA" \
            -- '*.md' '*.yml' '*.yaml' ':(exclude).github/**' \
            | grep '^+' | grep -v '^+++ ' | sed 's/^+//' > "$RUNNER_TEMP/pr-added-lines.md" || true
          echo "Lines added in content files: $(wc -l < "$RUNNER_TEMP/pr-added-lines.md")"

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Same exclusions as the nightly Link Checker. Only external links are
          # checked: relative links, root-relative links (resolved against
          # --root-dir to file:// URLs) and {% tool %} tags only resolve in the
          # built site, which the nightly check covers.
          args: --no-progress --exclude '^https://github\.com' --root-dir "${{ runner.temp }}" --scheme https --scheme http --accept '100..=103,200..=299,429' "${{ runner.temp }}/pr-added-lines.md"
          # Unlike the nightly check, fail so the broken link is fixed in the PR.
          fail: true
          # A PR whose added lines contain no links is fine.
          failIfEmpty: false
          lycheeVersion: v0.24.2
